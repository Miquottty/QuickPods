name: Portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version (for example 1.0.2)
        required: true
        default: 1.0.2
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  QUICKPODS_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  portable-release:
    name: Unsigned portable ZIP / x64
    runs-on: windows-2025
    timeout-minutes: 25

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          architecture: x64
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Validate release version
        run: |
          if ($env:QUICKPODS_RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
              throw 'Stable release version must use the form X.Y.Z.'
          }

          [xml] $props = Get-Content -LiteralPath Directory.Build.props
          $configuredVersion = $props.Project.PropertyGroup.VersionPrefix
          if ($configuredVersion -ne $env:QUICKPODS_RELEASE_VERSION) {
              throw "Requested version '$env:QUICKPODS_RELEASE_VERSION' does not match VersionPrefix '$configuredVersion'."
          }

      - name: Restore
        run: |
          dotnet restore QuickPods.sln --locked-mode
          dotnet restore installer/QuickPods.Setup/QuickPods.Setup.wixproj --locked-mode

      - name: Audit, format, build, and test
        run: |
          ./build/Test-DependencyVulnerabilities.ps1
          ./build/Test-RepositoryPublicReadiness.ps1
          dotnet format QuickPods.sln --verify-no-changes --no-restore --severity warn --verbosity minimal
          dotnet build QuickPods.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet test QuickPods.sln -c Release --no-build --no-restore -- RunConfiguration.TreatNoTestsAsError=true

      - name: Publish portable package
        run: >-
          ./build/Publish-ReleaseCandidate.ps1
          -OutputDirectory artifacts/release
          -Version $env:QUICKPODS_RELEASE_VERSION

      - name: Verify portable package
        run: |
          $archive = "artifacts/release/QuickPods-$env:QUICKPODS_RELEASE_VERSION-win-x64.zip"
          $checksumFile = 'artifacts/release/SHA256SUMS.txt'
          $manifestFile = 'artifacts/release/QuickPods/artifact-manifest.json'
          foreach ($path in @($archive, $checksumFile, $manifestFile)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required release artifact is missing: $path"
              }
          }

          $manifest = Get-Content -LiteralPath $manifestFile -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:QUICKPODS_RELEASE_VERSION -or $manifest.signed -ne $false) {
              throw 'Portable manifest version or signing state is invalid.'
          }

          ./build/Test-PortablePayload.ps1 `
              -PayloadDirectory artifacts/release/QuickPods `
              -ExpectedVersion $env:QUICKPODS_RELEASE_VERSION | Out-Null

          $expectedHash = ((Get-Content -LiteralPath $checksumFile -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw 'Portable archive checksum mismatch.'
          }

      - name: Upload portable release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickpods-${{ inputs.version }}-portable
          path: |
            artifacts/release/QuickPods-${{ inputs.version }}-win-x64.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/QuickPods/artifact-manifest.json
          if-no-files-found: error
          retention-days: 14
